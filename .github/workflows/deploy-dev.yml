name: Deploy Dev

on:
  workflow_call: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    environment: dev

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      ECR_REPOSITORY: nasc/dev/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            > /dev/null 2>&1; then

            echo "Image already exists in ECR."
          else
            docker build -t "$IMAGE" backend/
            docker push "$IMAGE"
          fi

          echo "BACKEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Discover infrastructure
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=nasc-dev-ec2" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)

          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier nasc-dev-postgres \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)

          [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]
          [[ -n "$DB_HOST" && "$DB_HOST" != "None" ]]

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"

      - name: Wait for SSM agent
        run: |
          for ((attempt=0; attempt<60; attempt++)); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)

            if [[ "$STATUS" == "Online" ]]; then
              exit 0
            fi

            sleep 10
          done

          echo "SSM agent did not become available." >&2
          exit 1

      - name: Deploy to EC2
        run: |
          SCRIPT=$(base64 -w 0 deploy/dev/deploy.sh)
          COMPOSE=$(base64 -w 0 deploy/dev/docker-compose.yml)

          COMMAND=$(cat <<EOF
          set -e
          umask 077
          install -d -m 700 /opt/nasc
          cd /opt/nasc
          echo '$SCRIPT' | base64 -d > deploy.sh
          echo '$COMPOSE' | base64 -d > docker-compose.yml
          chmod 700 deploy.sh
          EOF
          )

          printf -v DEPLOY_COMMAND \
            'bash deploy.sh %q %q %q %q' \
            "$AWS_REGION" \
            "$BACKEND_IMAGE" \
            "$DB_HOST" \
            "$GEMINI_MODEL"

          COMMAND+=$'\n'"$DEPLOY_COMMAND"

          PARAMETERS=$(jq -n \
            --arg command "$COMMAND" \
            '{commands: [$command], executionTimeout: ["1800"]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          for ((attempt=0; attempt<180; attempt++)); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null) || STATUS="Pending"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text

                exit 0
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep 10
                ;;

              *)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"

                exit 1
                ;;
            esac
          done

          echo "Deployment timed out." >&2
          exit 1
