name: Backend Deploy
run-name: "Backend Deploy | ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read

concurrency:
  group: backend-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy FastAPI Dev
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: nasc-dev-backend
      ECR_REGISTRY: 242627333067.dkr.ecr.us-east-2.amazonaws.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/nasc-dev-deploy
          aws-region: us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

          docker build \
            -f backend/Dockerfile \
            -t "$IMAGE" \
            backend

          docker push "$IMAGE"

          echo "ECR_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Find backend EC2
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=nasc-dev-backend" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == *$'\t'* ]]; then
            echo "Expected exactly one running backend EC2"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy with SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          compose = base64.b64encode(
              Path("deploy/docker-compose.yml").read_bytes()
          ).decode()

          image = os.environ["ECR_IMAGE"]

          commands = [
              "set -eu",
              "cd /opt/nasc/deploy",
              f"echo '{compose}' | base64 -d > docker-compose.yml",
              """aws secretsmanager get-secret-value \
                --secret-id nasc/dev/backend/config \
                --region us-east-2 \
                --query SecretString \
                --output text > /tmp/nasc-config.json""",
              """python3 - <<'PYENV'
          import json
          from pathlib import Path
          from urllib.parse import quote

          config = json.loads(
              Path('/tmp/nasc-config.json').read_text()
          )

          password = quote(
              config['POSTGRES_PASSWORD'],
              safe=''
          )

          config['DATABASE_URL'] = (
              'postgresql+asyncpg://nasc_admin:'
              + password
              + '@nasc-dev-postgres.cbwmwcm8yv8g.us-east-2.rds.amazonaws.com:5432/nasc'
          )

          config.setdefault(
              'GEMINI_MODEL',
              'gemini-2.5-flash'
          )

          with open('.env', 'w') as env:
              for key, value in config.items():
                  if key == 'POSTGRES_PASSWORD':
                      continue

                  env.write(f'{key}={value}\\n')
          PYENV""",
              "chmod 600 .env",
              "rm -f /tmp/nasc-config.json",
              f"printf '%s\\n' 'ECR_IMAGE={image}' > .compose.env",
              "aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 242627333067.dkr.ecr.us-east-2.amazonaws.com",
              "docker compose --env-file .compose.env pull",
              "docker compose --env-file .compose.env up -d",
              "docker compose --env-file .compose.env ps"
          ]

          Path("commands.json").write_text(
              json.dumps({"commands": commands})
          )
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://commands.json \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
