name: Terraform Dev

on:
  workflow_call: {}

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: infra/dev

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          terraform init \
            -backend-config="bucket=nasc-terraform-state-${ACCOUNT_ID}-${TF_VAR_aws_region}" \
            -backend-config="region=${TF_VAR_aws_region}"

      - name: Terraform Validate
        run: terraform validate

      - name: Load database password
        run: |
          PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id nasc/dev/app \
            --query SecretString \
            --output text | jq -er '.DB_PASSWORD | select(length > 0)')

          echo "::add-mask::$PASSWORD"
          echo "TF_VAR_db_password=$PASSWORD" >> "$GITHUB_ENV"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
