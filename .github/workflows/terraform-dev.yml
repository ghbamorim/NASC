name: Terraform Dev

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-dev.yml"

  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-dev.yml"

permissions:
  contents: read

concurrency:
  group: terraform-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive infra/

      - name: Initialize Terraform
        working-directory: infra/environments/dev
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: infra/environments/dev
        run: terraform validate -no-color

  plan:
    name: Terraform Plan
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/nasc-dev-plan
          aws-region: us-east-2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -lock=false -input=false -no-color

  verify-aws:
    name: Verify AWS OIDC
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::242627333067:role/nasc-dev-deploy
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity
