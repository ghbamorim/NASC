name: Terraform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      source_sha:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: infra/${{ inputs.environment }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python
        run: uv python install 3.14

      - name: Build Telegram send message Lambda
        working-directory: lambdas/telegram-send-message
        run: bash build.sh

      - name: Build Telegram process message Lambda
        working-directory: lambdas/telegram-process-message
        run: bash build.sh

      - name: Build Telegram receive message Lambda
        working-directory: lambdas/telegram-receive-message
        run: bash build.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.11.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          terraform init -input=false \
            -backend-config="bucket=nasc-terraform-state-${ACCOUNT_ID}-${TF_VAR_aws_region}" \
            -backend-config="region=${TF_VAR_aws_region}"

      - name: Terraform Validate
        run: terraform validate

      - name: Load database password
        run: |
          set -euo pipefail

          PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "nasc/${ENVIRONMENT}/app" \
            --query SecretString \
            --output text | jq -er '.DB_PASSWORD | select(length > 0)')

          echo "::add-mask::$PASSWORD"
          echo "TF_VAR_db_password=$PASSWORD" >> "$GITHUB_ENV"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
