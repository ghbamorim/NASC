services:
  api:
    image: ${ECR_IMAGE}
    container_name: nasc-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - path: .env
        format: raw

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
