repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --project backend ruff check --fix backend/
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: Ruff format
        entry: uv run --project backend ruff format backend/
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: terraform-fmt
        name: Terraform format
        entry: terraform fmt -recursive infra/
        language: system
        files: ^infra/.*\.tf(vars)?$
        pass_filenames: false

      - id: terraform-validate
        name: Terraform validate
        entry: terraform -chdir=infra/dev validate
        language: system
        files: ^infra/.*\.tf(vars)?$
        pass_filenames: false
