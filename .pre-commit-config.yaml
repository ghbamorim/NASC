repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --project backend ruff check --fix backend/
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: Ruff format
        entry: uv run --project backend ruff format backend/
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
